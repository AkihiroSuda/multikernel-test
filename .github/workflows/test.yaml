name: multikernel test (Lima)

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
    inputs:
      kernel_ref:
        description: "multikernel/linux ref to build (default: latest non-archive tag)"
        required: false
        default: ""

env:
  VM_NAME: mk
  VM_CPUS: 4
  VM_MEMORY_GIB: 8
  VM_DISK_GIB: 40

jobs:
  build-kernel:
    name: Build multikernel kernel (.deb)
    runs-on: ubuntu-26.04
    timeout-minutes: 300
    outputs:
      kernel_tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Resolve latest multikernel/linux tag
        id: tag
        run: |
          set -euxo pipefail
          if [ -n "${{ github.event.inputs.kernel_ref }}" ]; then
            tag="${{ github.event.inputs.kernel_ref }}"
          else
            tag=$(git ls-remote --tags --refs https://github.com/multikernel/linux.git \
              | awk -F/ '{print $NF}' | grep -E '^v[0-9]' | sort -V | tail -n1)
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Building multikernel/linux @ $tag"

      - name: Install build dependencies
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential bc bison flex libssl-dev libelf-dev libdw-dev libncurses-dev \
            dwarves rsync kmod cpio fakeroot dpkg-dev debhelper ccache \
            python3 git zstd

      - name: Cache ccache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ccache
          key: ccache-${{ runner.os }}-${{ steps.tag.outputs.tag }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ steps.tag.outputs.tag }}-
            ccache-${{ runner.os }}-

      - name: Check out multikernel/linux @ ${{ steps.tag.outputs.tag }}
        run: |
          set -euxo pipefail
          git clone --depth 1 --branch "${{ steps.tag.outputs.tag }}" \
            https://github.com/multikernel/linux.git linux

      - name: Configure kernel
        run: |
          set -euxo pipefail
          cd linux
          cp "/boot/config-$(uname -r)" .config
          # Required by multikernel
          scripts/config --enable CONFIG_MULTIKERNEL
          scripts/config --enable CONFIG_MKTTY
          # Since v7.0-mk3, the spawn kernel parses its manifest from the boot
          # device tree (initial_boot_params), which needs CONFIG_OF_EARLY_FLATTREE.
          # CONFIG_MULTIKERNEL does not select it, and Ubuntu's x86 config has CONFIG_OF off.
          scripts/config --enable CONFIG_OF
          # Keep the CI build fast and self-contained
          scripts/config --disable CONFIG_DEBUG_INFO
          scripts/config --disable CONFIG_DEBUG_INFO_DWARF5
          scripts/config --disable CONFIG_DEBUG_INFO_DWARF_TOOLCHAIN_DEFAULT
          scripts/config --disable CONFIG_DEBUG_INFO_BTF
          scripts/config --enable  CONFIG_DEBUG_INFO_NONE
          scripts/config --disable CONFIG_MODULE_SIG
          scripts/config --disable CONFIG_MODULE_SIG_ALL
          scripts/config --set-str CONFIG_SYSTEM_TRUSTED_KEYS ""
          scripts/config --set-str CONFIG_SYSTEM_REVOCATION_KEYS ""
          scripts/config --disable CONFIG_MODULE_COMPRESS_XZ
          scripts/config --disable CONFIG_MODULE_COMPRESS_ZSTD
          scripts/config --enable  CONFIG_MODULE_COMPRESS_NONE
          make olddefconfig
          for opt in MULTIKERNEL MKTTY OF OF_EARLY_FLATTREE; do
            grep -E "^CONFIG_${opt}=y" .config || { echo "CONFIG_${opt} not enabled"; exit 1; }
          done

      - name: Build Debian packages
        run: |
          set -euxo pipefail
          cd linux
          export CCACHE_DIR=~/.cache/ccache
          export KBUILD_BUILD_TIMESTAMP="$(git log -1 --format=%cd)"
          make -j"$(nproc)" CC="ccache gcc" LOCALVERSION=-multikernel bindeb-pkg
          mkdir -p ../debs
          mv ../linux-image-*.deb ../linux-headers-*.deb ../debs/
          ls -l ../debs
          ccache -s || true

      - uses: actions/upload-artifact@v7
        with:
          name: kernel-debs
          path: debs/*.deb
          if-no-files-found: error
          retention-days: 7

  vm-test:
    name: Run multikernel in Lima VM (ubuntu-26.04)
    needs: build-kernel
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: kernel-debs
          path: debs

      - uses: lima-vm/lima-actions/setup@v1
        id: lima-actions-setup

      - uses: actions/cache@v6
        with:
          path: ~/.cache/lima
          key: lima-${{ steps.lima-actions-setup.outputs.version }}-ubuntu-26.04

      - name: Start Lima VM (plain mode)
        run: |
          set -euxo pipefail
          limactl start --plain --name="$VM_NAME" \
            --cpus="$VM_CPUS" --memory="$VM_MEMORY_GIB" --disk="$VM_DISK_GIB" \
            template://ubuntu-26.04
          limactl list
          ssh "lima-$VM_NAME" 'uname -a; nproc; free -h; cat /etc/os-release'

      - name: Copy kernel packages into the VM
        run: rsync -a -e ssh debs "lima-$VM_NAME:/tmp/"

      - name: Install multikernel kernel
        run: |
          ssh "lima-$VM_NAME" sudo bash -s <<'EOS'
          set -euxo pipefail
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends initramfs-tools kmod

          dpkg -i /tmp/debs/linux-image-*.deb /tmp/debs/linux-headers-*.deb

          KVER=$(dpkg-deb -f /tmp/debs/linux-image-*.deb Package | sed 's/^linux-image-//')
          echo "Installed kernel: $KVER"
          test -f "/boot/vmlinuz-$KVER"

          # Make sure the new kernel is what we boot next, even if GRUB's
          # version sort would prefer the distro kernel.
          #
          # movablecore= reserves a ZONE_MOVABLE region, which the multikernel
          # pool allocator tries first. Unmovable kernel allocations never land
          # there, so "kerf init --memory=2GB" can always find contiguous memory.
          # Since v7.0-mk3 that allocation fails with ENOMEM in ZONE_NORMAL
          # after the first test returns its pool.
          if [ -d /boot/grub ]; then
            ENTRY=$(grep -oP "gnulinux-advanced-[^']+" /boot/grub/grub.cfg | head -n1 || true)
            if [ -n "$ENTRY" ]; then
              DEFAULT="$ENTRY>gnulinux-$KVER-advanced-${ENTRY#gnulinux-advanced-}"
              mkdir -p /etc/default/grub.d
              printf 'GRUB_DEFAULT="%s"\nGRUB_TIMEOUT=1\nGRUB_CMDLINE_LINUX="$GRUB_CMDLINE_LINUX movablecore=4G"\n' "$DEFAULT" > /etc/default/grub.d/99-multikernel.cfg
              cat /etc/default/grub.d/99-multikernel.cfg
              update-grub
              grub-set-default "$DEFAULT" || true
            fi
          fi
          EOS

      - name: Reboot VM into multikernel kernel
        run: |
          set -euxo pipefail
          ssh "lima-$VM_NAME" 'sudo systemctl reboot' || true
          for i in $(seq 1 60); do
            sleep 5
            if ssh -o ConnectTimeout=5 "lima-$VM_NAME" true 2>/dev/null; then break; fi
          done
          ssh "lima-$VM_NAME" 'uname -r | grep -q multikernel'
          ssh "lima-$VM_NAME" 'uname -a'
          ssh "lima-$VM_NAME" 'cat /proc/cmdline; grep -qw "movablecore=4G" /proc/cmdline'
          ssh "lima-$VM_NAME" 'grep -A3 "^Node 0, zone *Movable" /proc/zoneinfo' || true

      - name: Install Lazy CMA, Kerf and DAXFS
        run: |
          ssh "lima-$VM_NAME" sudo bash -s <<'EOS'
          set -euxo pipefail
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential git python3 python3-pip python3-venv python3-dev \
            device-tree-compiler libfdt-dev swig pkg-config pciutils \
            musl-tools busybox-static cpio docker.io
          systemctl enable --now docker

          KVER=$(uname -r)
          echo "$KVER" | grep -q multikernel
          test -d "/lib/modules/$KVER/build"

          cd /opt

          # 1. Lazy CMA
          rm -rf lazy_cma && git clone --depth 1 https://github.com/multikernel/lazy_cma.git
          make -C lazy_cma -j"$(nproc)"
          insmod lazy_cma/lazy_cma.ko
          test -c /dev/lazy_cma

          # 2. Kerf
          rm -rf kerf && git clone --depth 1 https://github.com/multikernel/kerf.git
          # Build the guest init binary (musl static) before "pip install":
          # the wheel only ships src/kerf/data/kerf-init if it exists, and
          # "kerf load --image" fails without it.
          make -C kerf
          python3 -m venv /opt/kerf-venv
          /opt/kerf-venv/bin/pip install --upgrade pip
          # pylibfdt builds its SWIG wrapper from source, and swig 4.5 dropped
          # the PyInt_* macros that wrapper still uses, so build pylibfdt
          # ourselves with a pinned swig before installing kerf.
          # https://github.com/multikernel/kerf/blob/v0.2.0/.github/workflows/lint_and_test.yml#L38-L46
          # setuptools is pinned <81 because rdtsc imports pkg_resources at
          # runtime, which setuptools 81+ no longer ships.
          /opt/kerf-venv/bin/pip install "swig<4.5" "setuptools<81" setuptools_scm
          PATH="/opt/kerf-venv/bin:$PATH" /opt/kerf-venv/bin/pip install --no-build-isolation "pylibfdt>=1.7.0,<2"
          /opt/kerf-venv/bin/pip install ./kerf
          /opt/kerf-venv/bin/python -c "from kerf.data import get_init_binary_path as p; assert p().exists(), p()"
          ln -sf /opt/kerf-venv/bin/kerf /usr/local/bin/kerf
          kerf --help
          kerf init --help

          # 3. DAXFS
          rm -rf daxfs && git clone --depth 1 https://github.com/multikernel/daxfs.git
          make -C daxfs -j"$(nproc)"
          insmod daxfs/daxfs/daxfs.ko

          lsmod | grep -E '^(lazy_cma|daxfs)'
          dmesg | tail -n 30
          EOS

      - name: Run kerf functionality test
        run: |
          ssh "lima-$VM_NAME" sudo bash -s <<'EOS'
          set -euxo pipefail
          INSTANCE=ci-guest
          KVER=$(uname -r)
          NCPU=$(nproc)
          [ "$NCPU" -ge 4 ] || { echo "need >= 4 CPUs, have $NCPU"; exit 1; }

          # Host keeps CPUs 0-1; the pool gets 2..(N-1). One CPU goes to the instance.
          POOL_CPUS="2-$((NCPU-1))"
          INST_CPU=$((NCPU-1))

          echo "=== kernel & module sanity"
          grep -q multikernel <<<"$KVER"
          test -d /sys/fs/multikernel || mount -t multikernel none /sys/fs/multikernel 2>/dev/null || true
          ls -la /sys/fs/multikernel
          test -c /dev/lazy_cma
          lsmod | grep -q '^daxfs'
          ls /dev | grep -i mktty || echo "(no mktty device node yet; created on instance boot)"

          cleanup() {
            set +e
            echo "=== cleanup"
            kerf kill "$INSTANCE"
            kerf unload "$INSTANCE"
            kerf delete "$INSTANCE"
            kerf init --cpus=none --memory=none
            kerf show
          }
          trap cleanup EXIT

          echo "=== kerf init"
          # "kerf init --report" prints the validation report and exits
          # without applying the baseline, so run the real init separately.
          kerf init --cpus="$POOL_CPUS" --memory=1GB --report
          kerf init --cpus="$POOL_CPUS" --memory=1GB
          kerf show
          grep -i multikernel /proc/iomem || true

          echo "=== kerf create"
          kerf create "$INSTANCE" --cpus="$INST_CPU" --memory=512MB
          kerf show "$INSTANCE"
          ls /sys/fs/multikernel/instances/
          kerf dump "$INSTANCE" --dts

          echo "=== kerf load"
          kerf load "$INSTANCE" \
            --kernel="/boot/vmlinuz-$KVER" \
            --initrd="/boot/initrd.img-$KVER" \
            --cmdline="console=ttyS0 console=mktty0 loglevel=7 rootfstype=ramfs rdinit=/bin/sh"
          kerf show "$INSTANCE"

          echo "=== kerf start"
          kerf start "$INSTANCE"
          # Wait for the instance to come up (the guest boots in a few
          # seconds on KVM, but give slow environments some slack).
          for i in $(seq 1 24); do
            sleep 5
            st=$(cat "/sys/fs/multikernel/instances/$INSTANCE/status")
            echo "status=$st"
            [ "$st" = "active" ] && break
          done
          kerf show "$INSTANCE"
          kerf show

          echo "=== verify"
          # The instance CPU must have left the host.
          if grep -qw "$INST_CPU" /sys/devices/system/cpu/online; then
            echo "FAIL: CPU $INST_CPU still online on host after kerf start"; exit 1
          fi
          find /sys/fs/multikernel/instances -maxdepth 2 -type f | while read -r f; do
            printf '%s: ' "$f"; cat "$f" 2>/dev/null || echo "?"
          done
          # No "grep -q": with pipefail it would SIGPIPE kerf on early exit.
          if kerf show "$INSTANCE" | grep -iE 'running|active|booted'; then
            echo "PASS: instance $INSTANCE is running"
          else
            echo "WARN: could not confirm running state from 'kerf show'; see sysfs dump above"
          fi
          dmesg | grep -iE 'multikernel|mktty|kexec' | tail -n 40

          echo "=== kerf kill"
          kerf kill "$INSTANCE"
          sleep 5
          kerf show "$INSTANCE" || true
          echo "SUCCESS"
          EOS

      - name: Run kerf Docker image test (nginx)
        run: |
          ssh "lima-$VM_NAME" sudo bash -s <<'EOS'
          set -euxo pipefail
          INSTANCE=nginx-demo
          KVER=$(uname -r)
          NCPU=$(nproc)
          POOL_CPUS="2-$((NCPU-1))"
          INST_CPU=$((NCPU-1))

          docker pull nginx:latest

          # The CI kernel builds daxfs as an out-of-tree module, so boot the
          # guest with a minimal initramfs that loads daxfs.ko, mounts the
          # daxfs image from the rootflags= physical address and
          # switch_roots into it (the module case from "kerf load --help").
          W=/root/mk-initrd
          rm -rf "$W"; mkdir -p "$W/bin" "$W/dev" "$W/proc" "$W/sys" "$W/newroot"
          cp /usr/bin/busybox "$W/bin/busybox"
          cp /opt/daxfs/daxfs/daxfs.ko "$W/daxfs.ko"
          mknod "$W/dev/console" c 5 1
          cat > "$W/init" <<'EOF'
          #!/bin/busybox sh
          /bin/busybox mount -t proc proc /proc
          rootflags=
          for w in $(/bin/busybox cat /proc/cmdline); do
            case "$w" in rootflags=*) rootflags="${w#rootflags=}" ;; esac
          done
          /bin/busybox insmod /daxfs.ko
          /bin/busybox mount -t daxfs -o "$rootflags" none /newroot
          # Bring loopback up so the guest can reach its own sockets.
          /bin/busybox ip link set lo up
          /bin/busybox umount /proc
          exec /bin/busybox switch_root /newroot /init
          EOF
          chmod +x "$W/init"
          (cd "$W" && find . | cpio -o -H newc | gzip -1 > /root/daxfs-initrd.img)

          # Console reader: write the instance id to /dev/mktty, then
          # stream the guest console to a file (same protocol as
          # "kerf console", but non-interactive).
          cat > /root/mktty-dump.py <<'EOF'
          import os, select, sys, time
          fd = os.open("/dev/mktty", os.O_RDWR)
          os.write(fd, (sys.argv[1] + "\n").encode())
          end = time.time() + float(sys.argv[2])
          out = open(sys.argv[3], "wb", buffering=0)
          while time.time() < end:
              r, _, _ = select.select([fd], [], [], 0.5)
              if r:
                  d = os.read(fd, 65536)
                  if not d:
                      break
                  out.write(d)
          os.close(fd)
          EOF

          cleanup() {
            set +e
            echo "=== cleanup"
            kerf kill "$INSTANCE"
            kerf unload "$INSTANCE"
            kerf delete "$INSTANCE"
            kerf init --cpus=none --memory=none
            kerf show
          }
          trap cleanup EXIT

          echo "=== kerf init"
          kerf init --cpus="$POOL_CPUS" --memory=2GB
          kerf show

          echo "=== kerf create"
          kerf create "$INSTANCE" --cpus="$INST_CPU" --memory=1GB
          INST_ID=$(/opt/kerf-venv/bin/python -c "from kerf.utils import get_instance_id_from_name; print(get_instance_id_from_name('$INSTANCE'))")
          echo "instance id: $INST_ID"

          echo "=== kerf load (Docker image as daxfs rootfs)"
          # nginx's port is not reachable from the host: this kernel has no
          # inter-kernel network device, so the guest only has "lo". Verify
          # nginx serves by fetching over loopback from inside the guest
          # (bash /dev/tcp) and watching the mktty console from the host.
          kerf load "$INSTANCE" \
            --kernel="/boot/vmlinuz-$KVER" \
            --initrd=/root/daxfs-initrd.img \
            --image=nginx:latest \
            --entrypoint="/bin/bash -c 'echo NETDEVS:; ls /sys/class/net; nginx; sleep 3; exec 3<>/dev/tcp/127.0.0.1/80; echo GET / >&3; cat <&3; sleep infinity'" \
            --cmdline="loglevel=7" \
            --console=mktty0 \
            --verbose

          echo "=== kerf start"
          python3 /root/mktty-dump.py "$INST_ID" 240 /root/console.log &
          DUMP_PID=$!
          kerf start "$INSTANCE"
          for i in $(seq 1 24); do
            sleep 5
            st=$(cat "/sys/fs/multikernel/instances/$INSTANCE/status")
            echo "status=$st"
            [ "$st" = "active" ] && grep -q "Welcome to nginx" /root/console.log && break
          done
          kerf show "$INSTANCE"

          echo "=== guest console"
          kill "$DUMP_PID" 2>/dev/null || true
          wait "$DUMP_PID" 2>/dev/null || true
          cat /root/console.log
          grep -q "Welcome to nginx" /root/console.log
          echo "PASS: nginx served HTTP on 127.0.0.1:80 inside the spawn kernel"
          echo "SUCCESS"
          EOS

      - name: Collect logs
        if: always()
        run: |
          set -x
          mkdir -p logs
          ssh "lima-$VM_NAME" 'sudo dmesg' > logs/dmesg.txt || true
          ssh "lima-$VM_NAME" 'sudo cat /proc/buddyinfo /proc/pagetypeinfo /proc/zoneinfo' > logs/meminfo.txt || true
          ssh "lima-$VM_NAME" 'sudo journalctl -b --no-pager' > logs/journal.txt || true
          ssh "lima-$VM_NAME" 'sudo cat /root/console.log' > logs/nginx-console.txt || true
          ssh "lima-$VM_NAME" 'sudo find /sys/fs/multikernel -type f 2>/dev/null | while read f; do echo "== $f"; cat "$f" 2>/dev/null; done' > logs/sysfs-multikernel.txt || true
          cp -r ~/.lima/"$VM_NAME"/*.log logs/ 2>/dev/null || true

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: vm-logs
          path: logs/

      - name: Stop VM
        if: always()
        run: limactl delete -f "$VM_NAME" || true
